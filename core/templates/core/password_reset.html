{% extends 'core/base.html' %}{% block title %}Reset password{% endblock %}{% block body %}<main class="page page-narrow"><section class="card form-card"><span class="eyebrow">Account recovery</span><h1>Forgot your password?</h1><p class="muted">Enter your account email. If it matches, we’ll send a password reset link.</p><form method="post">{% csrf_token %}<div class="field"><label for="id_email">Email address</label>{{ form.email }}</div><button class="button" type="submit">Send reset link</button></form></section></main>{% endblock %}
